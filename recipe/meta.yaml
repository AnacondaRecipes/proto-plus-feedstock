{% set name = "proto-plus" %}
{% set version = "1.29.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: cfb4e62ad7e13dd18f346cabbda00cab39930d36a05791fd81ddb074d6ee884f

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

# Upstrem source - https://github.com/googleapis/google-cloud-python/blob/proto-plus-v1.29.0/packages/proto-plus/pyproject.toml
requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - protobuf >=6.33.5,<8.0.0

test:
  source_files:
    - tests
  imports:
    - proto
    - proto.marshal
  commands:
    - pip check
    - pytest -vv tests
  requires:
    - pip
    - pytest
    - pytz
    - google-api-core >=1.31.5

about:
  home: https://github.com/googleapis/google-cloud-python/tree/main/packages/proto-plus
  summary: Beautiful, Pythonic protocol buffers.
  description: |
    This is a wrapper around protocol buffers. Protocol buffers is a specification
    format for APIs, such as those inside Google. This library provides protocol
    buffer message classes and objects that largely behave like native Python types.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/googleapis/google-cloud-python/tree/main/packages/proto-plus
  doc_url: https://googleapis.dev/python/proto-plus/latest

extra:
  recipe-maintainers:
    - tswast
  skip-lints:
    # doc_url is reachable
    - reachable_url
