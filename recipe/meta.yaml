{% set name = "proto-plus" %}
{% set version = "1.28.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 832e68e7fe064cf90ab153b6e5eb935b27891bb89aaeb68b115e9b702f6cb168

build:
  number: 1
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - protobuf 7.35.1
    - setuptools
  run:
    - python
    - protobuf >=4.25.8,<8.0.0

test:
  source_files:
    - tests
  imports:
    - proto
    - proto.marshal
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest
    - pytz
    - google-api-core >=1.31.5

about:
  home: https://github.com/googleapis/google-cloud-python/tree/main/packages/proto-plus
  summary: Beautiful, Pythonic protocol buffers.
  description: |
    This is a wrapper around protocol buffers. Protocol buffers is a specification
    format for APIs, such as those inside Google. This library provides protocol
    buffer message classes and objects that largely behave like native Python types.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/googleapis/google-cloud-python/tree/main/packages/proto-plus
  doc_url: https://googleapis.dev/python/proto-plus/latest

extra:
  recipe-maintainers:
    - tswast
